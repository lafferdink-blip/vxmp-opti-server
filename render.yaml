# Fichier de déploiement Render (gratuit)
services:
  - type: web
    name: vxmp-opti
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OWNER_DISCORD_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DOWNLOAD_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: KEY_PREFIX
        value: BOOST
      - key: MAX_DEVICES
        value: "2"
      - key: ALLOWED_REBINDS
        value: "3"

  - type: worker
    name: vxmp-discord-bot
    runtime: python
    rootDir: discord/bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: STAFF_ROLE_ID
        sync: false
      - key: CLIENT_ROLE_ID
        sync: false
      - key: VIP_ROLE_ID
        sync: false
      - key: CATEGORY_ID
        sync: false
      - key: TRANSCRIPT_CHANNEL_ID
        sync: false
      - key: DB_PATH
        value: tickets.db
